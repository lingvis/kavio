  /* Keypad Comma/Equal & International (0x85 ~ 0x8F) */
  KC_KP_COMMA = 133;
  KC_KP_EQUAL_AS400 = 134;
  KC_INTERNATIONAL1 = 135;
  KC_INTERNATIONAL2 = 136;
  KC_INTERNATIONAL3 = 137;
  KC_INTERNATIONAL4 = 138;
  KC_INTERNATIONAL5 = 139;
  KC_INTERNATIONAL6 = 140;
  KC_INTERNATIONAL7 = 141;
  KC_INTERNATIONAL8 = 142;
  KC_INTERNATIONAL9 = 143;

  /* Languages (0x90 ~ 0x98) */
  KC_LANG1 = 144;
  KC_LANG2 = 145;
  KC_LANG3 = 146;
  KC_LANG4 = 147;
  KC_LANG5 = 148;
  KC_LANG6 = 149;
  KC_LANG7 = 150;
  KC_LANG8 = 151;
  KC_LANG9 = 152;

  /* Modifiers (0xE0 ~ 0xE7) */
  KC_LCTRL = 224;
  KC_LSHIFT = 225;
  KC_LALT = 226;
  KC_LGUI = 227;
  KC_RCTRL = 228;
  KC_RSHIFT = 229;
  KC_RALT = 230;
  KC_RGUI = 231;
}

message KeyboardEventPb {
  enum KeyOptionPb {
    KEY_OPTION_UNKNOWN = 0;
    KEY_OPTION_DOWN = 1;
    KEY_OPTION_UP = 2;
  }

  KeyOptionPb key_option = 1;
  InputKeyCodePb key_code = 2;
}

message MouseEventPb {
  enum MouseOptionPb {
    MOUSE_OPTION_UNKNOWN = 0;
    MOUSE_OPTION_MOVE = 1;
    MOUSE_OPTION_LBUTTON_DOWN = 2;
    MOUSE_OPTION_LBUTTON_UP = 3;
    MOUSE_OPTION_RBUTTON_DOWN = 4;
    MOUSE_OPTION_RBUTTON_UP = 5;
    MOUSE_OPTION_MBUTTON_DOWN = 6;
    MOUSE_OPTION_MBUTTON_UP = 7;
    MOUSE_OPTION_WHEEL = 8;
  }

  MouseOptionPb mouse_option = 1;
  int32 x = 2;
  int32 y = 3;
  int32 wheel = 4;
}

message InputEventPb {
  uint64 timestamp_ns = 1;

  /* 10~19：具体输入事件类型区段。 */
  oneof event_body {
    KeyboardEventPb keyboard = 10;
    MouseEventPb mouse = 11;
  }
}