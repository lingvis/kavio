syntax = "proto3";

package kavio.input.proto;

/* ============================================================================
 * 说明
 * ----------------------------------------------------------------------------
 * 1. input.proto 用于定义通用输入设备事件模型，覆盖键盘与鼠标常见操作
 * 2. 本文件定义独立输入消息模型，不接入 IPCPackagePb；IPC 封装由上层通信模块负责
 * 3. 键盘 key_code 直接传输 HID Usage Keyboard/Keypad (Usage Page 0x07) 数值
 *    公共命名定义统一维护在 <kavio/Keyboard.h>，Proto 不重复维护键码枚举
 * 4. InputEventPb 统一封装 keyboard / mouse 两类输入事件，具体类型由 oneof body_case 判定
 * ========================================================================== */

message KeyboardEventPb {
  enum KeyOptionPb {
    KEY_OPTION_UNKNOWN = 0;
    KEY_OPTION_DOWN = 1;
    KEY_OPTION_UP = 2;
  }

  KeyOptionPb key_option = 1;
  // USB HID Keyboard/Keypad usage ID (Usage Page 0x07).
  // Keep field number 2 for wire compatibility; named values live in Keyboard.h.
  int32 key_code = 2;
}

message MouseEventPb {
  enum MouseOptionPb {
    MOUSE_OPTION_UNKNOWN = 0;
    MOUSE_OPTION_MOVE = 1;
    MOUSE_OPTION_LBUTTON_DOWN = 2;
    MOUSE_OPTION_LBUTTON_UP = 3;
    MOUSE_OPTION_RBUTTON_DOWN = 4;
    MOUSE_OPTION_RBUTTON_UP = 5;
    MOUSE_OPTION_MBUTTON_DOWN = 6;
    MOUSE_OPTION_MBUTTON_UP = 7;
    MOUSE_OPTION_WHEEL = 8;
  }

  MouseOptionPb mouse_option = 1;
  int32 x = 2;
  int32 y = 3;
  int32 wheel = 4;
}

message InputEventPb {
  uint64 timestamp_ns = 1;

  /* 10~19：具体输入事件类型区段。 */
  oneof event_body {
    KeyboardEventPb keyboard = 10;
    MouseEventPb mouse = 11;
  }
}