syntax = "proto3";

package kavio.config.proto;

import "input_defs.proto";

/* ==========================================================================
 * 用户配置模型说明
 * --------------------------------------------------------------------------
 * 1. 本文件承载可被客户端读取和修改的用户配置。
 * 2. 配置文件采用 protobuf 文本格式落盘，方便人工查看与修改。
 * 3. 配置结构按照菜单页面层级组织，避免本机输入行为和被控机输出行为混杂。
 * 4. 配置文件必须与当前 schema 保持一致；结构变更时同步更新对应配置内容。
 * ======================================================================== */

/* ==========================================================================
 * 输入输出 -> 键盘鼠标输入
 * --------------------------------------------------------------------------
 * 描述当前设备本地键盘鼠标输入的处理方式。
 * ======================================================================== */
message KeyboardMouseInputConfigPb {
  /* 本机普通键盘鼠标是否转发给被控主机。 */
  bool local_input_forward_enabled = 1;

  /* 本机普通键盘唤醒菜单快捷键。稳定字符串，例如 ctrl+alt+m。 */
  string wake_menu_hotkey = 2;
}

/* ==========================================================================
 * 输入输出 -> 键盘鼠标输出
 * --------------------------------------------------------------------------
 * 只表达发送给被控机的键盘鼠标输出配置，不表达本机输入行为。
 * ======================================================================== */
message InputConfigPb {
  /* 是否使能被控主机键盘鼠标输出。 */
  bool device_enabled = 1;

  /*
   * 输出设备名称，将体现在蓝牙名称或者 2.4G 接收器名称上。
   * 超长会被上层截断；如果留空，默认使用主板名称。
   */
  string device_name = 2;

  /* 10~19：输入模式与通道选择区段。 */
  /* 启动初始化使用的输入模式；用户切换后会同步写回配置文件。 */
  kavio.input.proto.InputModePb mode = 10;

  /* 启动初始化使用的通道编号；用户切换后会同步写回配置文件。 */
  kavio.input.proto.InputChannelPb channel = 11;
}

/* ==========================================================================
 * 输入输出 -> 键盘鼠标
 * ======================================================================== */
message KeyboardMouseConfigPb {
  /* 当前设备的本地键盘鼠标输入行为。 */
  KeyboardMouseInputConfigPb input = 1;

  /* 输出给被控机的键盘鼠标配置。 */
  InputConfigPb output = 2;
}

/* ==========================================================================
 * 系统设置 -> 菜单显示
 * --------------------------------------------------------------------------
 * 菜单背景遮罩、主题、菜单鼠标等显示行为配置。
 * ======================================================================== */
message MenuDisplayConfigPb {
  /* 菜单外部背景遮罩透明度，范围 10~100。 */
  int32 background_dim_percent = 1;

  /* 菜单主题编号，对应 AppMenu.cpp 中 ThemeOptions 的 option value。 */
  int32 theme_index = 2;

  /* 菜单鼠标样式。0=关闭，1=样式1。 */
  int32 mouse_style = 3;
}

/* ==========================================================================
 * 系统设置
 * ======================================================================== */
message SystemSettingsConfigPb {
  /* 菜单显示相关配置。 */
  MenuDisplayConfigPb menu_display = 1;
}

/* ==========================================================================
 * 语言
 * --------------------------------------------------------------------------
 * 描述设备菜单使用的语言配置。
 * ======================================================================== */
message LanguageConfigPb {
  /* 菜单语言。使用 C++ MenuLanguage 的 int 值。 */
  int32 language = 1;
}


/* ==========================================================================
 * 显示视频 -> 动画图层
 * --------------------------------------------------------------------------
 * 只控制外部 session TX SHM 提交的动画/叠加图层，不控制菜单最高层。
 * ======================================================================== */
enum AnimationLayerRenderModePb {
  ANIMATION_LAYER_RENDER_MODE_QUALITY_FIRST = 0;
  ANIMATION_LAYER_RENDER_MODE_SPEED_FIRST = 1;
}

message AnimationLayerConfigPb {
  /* 是否启用外部 session 的动画/叠加图层。 */
  bool enabled = 1;

  /* 渲染策略。0=效果优先，1=速度优先。 */
  AnimationLayerRenderModePb render_mode = 2;
}

message DisplayVideoConfigPb {
  AnimationLayerConfigPb animation_layer = 1;
}


/* ==========================================================================
 * 内置功能
 * --------------------------------------------------------------------------
 * 仅描述用户对内置功能的选择。功能运行所需的固定系统参数保存在 sys_config。
 * ======================================================================== */
message BuiltinMfsUserConfigPb {
  /* 是否启用 MFS 文件系统。 */
  bool enabled = 1;
}

message BuiltinTunUserConfigPb {
  /* 是否启用网络代理。 */
  bool enabled = 1;
}

message BuiltinServiceUserConfigPb {
  BuiltinMfsUserConfigPb mfs = 1;
  BuiltinTunUserConfigPb tun = 2;
}

message UserConfigPb {
  /* 显示视频。 */
  DisplayVideoConfigPb display_video = 1;
  
  /* 输入输出 -> 键盘鼠标。 */
  KeyboardMouseConfigPb keyboard_mouse = 2;

  /* 系统设置。 */
  SystemSettingsConfigPb system_settings = 3;

  /* 语言。 */
  LanguageConfigPb language = 4;

  /* 内置功能。 */
  BuiltinServiceUserConfigPb builtin_service = 5;
}
