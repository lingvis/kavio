syntax = "proto3";

import "input.proto";
import "runtime_data.proto";

package kavio.ipc.proto;

/* ============================================================================
 * 说明
 * ----------------------------------------------------------------------------
 * 1. 所有控制消息统一放在 IPCPackagePb 中
 * 2. 图像数据不走 protobuf，只走 POSIX SHM
 * 3. IPCPackagePb 分为 header / payload 两部分
 * 4. track_id 由请求发起方生成，请求-应答链路必须回显同一个 track_id
 * ========================================================================== */

enum PixelFormatPb {
  PIXEL_FORMAT_UNKNOWN = 0;
  PIXEL_FORMAT_UYVY = 1;
  PIXEL_FORMAT_YUYV = 2;
  PIXEL_FORMAT_BGRA8888 = 3;
}

enum StatusCodePb {
  STATUS_OK = 0;
  STATUS_INVALID_ARGUMENT = 1;
  STATUS_TOO_MANY_SESSIONS = 2;
  STATUS_ALREADY_EXISTS = 3;
  STATUS_NOT_FOUND = 4;
  STATUS_SHM_CREATE_FAILED = 5;
  STATUS_SOCKET_ERROR = 6;
  STATUS_PROTOCOL_ERROR = 7;
  STATUS_INTERNAL_ERROR = 8;
  STATUS_AUTH_FAILED = 9;
  STATUS_INVALID_STATE = 10;
  STATUS_UNSUPPORTED = 11;
}

// IPC direction is always relative to the managed Device App:
// A2P = App -> Platform, P2A = Platform -> App.
// REQ needs a response; RSP echoes IPCHeaderPb.track_id; NTF has no required
// response; DATA transports application payload without a request/reply pair.
enum MessageTypePb {
  // 未知消息；禁止主动发送。
  MSG_UNKNOWN = 0;
  // A2P 请求创建 IPC Session。
  MSG_A2P_REQ_CREATE_SESSION = 1;
  // P2A 回复创建 Session 的结果和资源。
  MSG_P2A_RSP_CREATE_SESSION = 2;
  // A2P 请求关闭 Session，通用状态回复。
  MSG_A2P_REQ_CLOSE_SESSION = 3;
  // A2P 设置 RX 参数，通用状态回复。
  MSG_A2P_REQ_SET_RX_PARAMS = 10;
  // P2A 通知 RX SHM 已就绪。
  MSG_P2A_NTF_RX_SHM_READY = 11;
  // P2A 通知 RX SHM 失效。
  MSG_P2A_NTF_RX_SHM_INVALIDATED = 12;
  // A2P 请求创建 TX SHM。
  MSG_A2P_REQ_CREATE_TX_SHM = 20;
  // P2A 回复创建 TX SHM 的信息。
  MSG_P2A_RSP_CREATE_TX_SHM = 21;
  // A2P 请求销毁 TX SHM，通用状态回复。
  MSG_A2P_REQ_DESTROY_TX_SHM = 22;
  // P2A TX SHM 销毁通知（目前未发送）。
  MSG_P2A_NTF_TX_SHM_DESTROYED = 23;
  // A2P 设置 TX 参数，通用状态回复。
  MSG_A2P_REQ_SET_TX_PARAMS = 30;
  // A2P 发送输入事件；不要求应答。
  MSG_A2P_NTF_INPUT_EVENT = 31;
  // A2P 查询完整 Runtime 状态。
  MSG_A2P_REQ_QUERY_RUNTIME_DATA = 40;
  // A2P 查询 RX Runtime 状态。
  MSG_A2P_REQ_QUERY_RUNTIME_RX_INFO = 41;
  // A2P 查询 TX Runtime 状态。
  MSG_A2P_REQ_QUERY_RUNTIME_TX_INFO = 42;
  // A2P 查询 Input Runtime 状态。
  MSG_A2P_REQ_QUERY_RUNTIME_INPUT = 43;
  // P2A Runtime 查询应答，以 track_id 匹配。
  MSG_P2A_RSP_RUNTIME_DATA = 44;
  // P2A Runtime 状态主动广播，track_id=0。
  MSG_P2A_NTF_RUNTIME_DATA = 45;
  // A2P 查询统计信息。
  MSG_A2P_REQ_QUERY_STATS = 50;
  // P2A 返回统计快照。
  MSG_P2A_RSP_QUERY_STATS = 51;
  // A2P 订阅编码流。
  MSG_A2P_REQ_CREATE_ENCODE_STREAM = 60;
  // P2A 返回编码流 SHM 信息。
  MSG_P2A_RSP_CREATE_ENCODE_STREAM = 61;
  // A2P 取消编码流订阅，通用状态回复。
  MSG_A2P_REQ_DESTROY_ENCODE_STREAM = 62;
  // P2A 通知编码流失效。
  MSG_P2A_NTF_ENCODE_STREAM_INVALIDATED = 65;
  // P2A 通知编码流有新帧。
  MSG_P2A_NTF_ENCODE_FRAME_READY = 66;
  // P2A 通知 USB Host 在线状态。
  MSG_P2A_NTF_USB_HOST_STATE = 70;
  // P2A 通知 Host Component 在线状态。
  MSG_P2A_NTF_COMM_PEER_STATE = 71;
  // P2A 转发来自 Host Component 的 App Channel 数据。
  MSG_P2A_DATA_COMM_CHANNEL = 73;
  // A2P 发送 App Channel 数据给 Host Component。
  MSG_A2P_DATA_COMM_CHANNEL = 74;
  // P2A 请求读取 Schema 和当前配置。
  MSG_P2A_REQ_GET_APP_CONFIG = 75;
  // A2P 返回 Schema、当前配置或错误。
  MSG_A2P_RSP_GET_APP_CONFIG = 76;
  // P2A 请求保存完整配置 JSON。
  MSG_P2A_REQ_SET_APP_CONFIG = 77;
  // A2P 返回保存结果和当前配置。
  MSG_A2P_RSP_SET_APP_CONFIG = 78;
  // A2P 请求创建独立的全屏 AppView 共享画布；不属于 TX Overlay Surface。
  MSG_A2P_REQ_CREATE_APP_VIEW_SURFACE = 80;
  // P2A 返回 AppView 共享画布信息。
  MSG_P2A_RSP_CREATE_APP_VIEW_SURFACE = 81;
  // A2P 请求销毁独立的全屏 AppView 共享画布。
  MSG_A2P_REQ_DESTROY_APP_VIEW_SURFACE = 82;
  // A2P 通知 AppView 共享画布有新帧；不要求应答。
  MSG_A2P_NTF_APP_VIEW_FRAME_READY = 83;
  // P2A AppView foreground pointer event. Only the foreground managed App receives it.
  MSG_P2A_NTF_APP_VIEW_POINTER = 84;
  // P2A AppView visibility event (not equivalent to process start/stop).
  MSG_P2A_NTF_APP_VIEW_VISIBILITY = 85;
  // P2A 通用状态回复，适用于无专用 RSP 的请求。
  MSG_P2A_RSP_STATUS = 90;
  // P2A 请求错误回复，failed_for 指明失败请求。
  MSG_P2A_RSP_ERROR = 91;
}

message IPCHeaderPb {
  MessageTypePb msg_type = 1;
  uint64 track_id = 2;
}

message ShmInfoPb {
  uint32 id = 1;
  string name = 2;
  uint64 size = 3;

  uint32 width = 4;
  uint32 height = 5;
  uint32 stride = 6;

  PixelFormatPb pixel_format = 7;
}

message RxParamsPb {
  bool enabled = 1;
  uint32 frame_sample_interval = 2;
}

message TxParamsPb {
  bool enabled = 1;
  int32 z_order = 2;
}

message SdkVersionPb {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message A2PReqCreateSessionPb {
  string client_name = 1;
  int32 client_pid = 2;
  RxParamsPb rx_params = 3;
  TxParamsPb tx_params = 4;

  // 当前 Device Component 使用的 SDK 版本。
  SdkVersionPb sdk_version = 5;

}

message P2ARspCreateSessionPb {
  uint32 session_id = 1;
  uint32 max_sessions = 2;
  uint32 max_rx_shms_per_session = 3;
  uint32 max_tx_shms_per_session = 4;
  RxParamsPb rx_params = 5;
  TxParamsPb tx_params = 6;

  // 当前 Device Component 的稳定业务 ChannelID，由 Platform 根据 app_id 生成。
  uint32 comm_channel_id = 7;
  // 当前对端 Host Component 是否在线。
  bool comm_peer_online = 8;
}

message A2PReqCreateTxShmPb {
  uint32 width = 1;
  uint32 height = 2;
  PixelFormatPb pixel_format = 3;
}

message P2ARspCreateTxShmPb {
  ShmInfoPb tx_shm = 1;
}

message A2PReqDestroyTxShmPb {
  uint32 shm_id = 1;
}

message P2ANtfTxShmDestroyedPb {
  uint32 shm_id = 1;
}

message A2PReqSetRxParamsPb {
  RxParamsPb params = 1;
}

message P2ARspStatusPb {
  int32 code = 1;
  string message = 2;
}

message P2ANtfRxShmReadyPb {
  ShmInfoPb rx_shm = 1;
  uint64 generation = 2;
}

enum RxShmInvalidReasonPb {
  RX_SHM_INVALID_REASON_UNKNOWN = 0;
  RX_SHM_INVALID_REASON_DISABLED = 1;
  RX_SHM_INVALID_REASON_SESSION_CLOSED = 2;
}

message P2ANtfRxShmInvalidatedPb {
  uint32 shm_id = 1;
  uint64 generation = 2;
  RxShmInvalidReasonPb reason = 3;
}

message A2PReqSetTxParamsPb {
  TxParamsPb params = 1;
}

message P2ARspErrorPb {
  uint64 track_id = 1;
  MessageTypePb failed_for = 2;
  StatusCodePb code = 3;
  string message = 4;
}

message A2PReqQueryStatsPb {
  bool all_sessions = 1;
}

message A2PReqQueryRuntimeDataPb {
}

message A2PReqQueryRuntimeRxInfoPb {
}

message A2PReqQueryRuntimeTxInfoPb {
}

message A2PReqQueryRuntimeInputPb {
}


message A2PReqCloseSessionPb {
  uint32 session_id = 1;
}

message GlobalRuntimeStatsPb {
  uint32 current_session_count = 1;
  uint32 max_session_count = 2;
  uint32 current_input_width = 3;
  uint32 current_input_height = 4;
  uint32 current_output_width = 5;
  uint32 current_output_height = 6;
  uint32 current_input_fps = 7;
  uint32 current_output_fps = 8;
  uint64 rx_frames = 9;
  uint64 tx_frames = 10;
  uint64 published_frames = 11;
  uint64 dropped_publish_count = 12;
  uint64 resolution_change_count = 13;
  uint64 signal_lost_count = 14;
  uint64 signal_restore_count = 15;
}

message FrameBrokerStatsPb {
  uint64 total_frames_published = 1;
  uint64 total_session_publish_ok = 2;
  uint64 total_session_publish_drop = 3;
  uint64 total_session_publish_skip = 4;
}

message OverlayManagerStatsPb {
  uint64 total_snapshot_requests = 1;
  uint64 total_layers_returned = 2;
  uint64 total_layers_skipped = 3;
}

message TxRendererStatsPb {
  uint64 total_render_calls = 1;
  uint64 total_layers_submitted = 2;
  uint64 total_layers_skipped = 3;
  uint64 total_submit_errors = 4;
}

message SessionStatsPb {
  uint32 session_id = 1;
  int32 z_order = 2;
  bool rx_stream_enable = 3;
  bool tx_stream_enable = 4;
  uint64 connect_time_ms = 5;
  string client_name = 6;
  uint64 rx_frames_written = 7;
  uint64 tx_updates_seen = 8;
  uint64 dropped_rx_frames = 9;
  uint64 dropped_tx_updates = 10;
  uint32 rx_frame_sample_interval = 11;
  int32 client_pid = 12;
}

message P2ARspQueryStatsPb {
  GlobalRuntimeStatsPb global = 1;
  FrameBrokerStatsPb frame_broker = 2;
  OverlayManagerStatsPb overlay_manager = 3;
  TxRendererStatsPb tx_renderer = 4;
  repeated SessionStatsPb sessions = 5;
}

enum VideoCodecPb {
  VIDEO_CODEC_UNKNOWN = 0;
  VIDEO_CODEC_H264 = 1;
}


enum EncodedStreamInvalidReasonPb {
  ENCODED_STREAM_INVALID_REASON_UNKNOWN = 0;
  ENCODED_STREAM_INVALID_REASON_SESSION_CLOSED = 1;
  ENCODED_STREAM_INVALID_REASON_RX_DISCONNECTED = 2;
  ENCODED_STREAM_INVALID_REASON_RESOLUTION_CHANGED = 3;
  ENCODED_STREAM_INVALID_REASON_ENCODER_ERROR = 4;
  ENCODED_STREAM_INVALID_REASON_PLATFORM_RESET = 5;
}

// Empty request: encoding settings are owned by Platform.
message A2PReqCreateEncodeStreamPb {}

message EncodedStreamShmInfoPb {
  uint32 stream_id = 1;
  string name = 2;
  uint64 size = 3;

  VideoCodecPb codec = 4;
  uint32 width = 5;
  uint32 height = 6;
  uint32 fps = 7;
  uint32 bitrate_kbps = 8;
  uint32 gop = 9;

  uint32 packet_capacity = 10;
  uint32 payload_capacity = 11;

}

message P2ARspCreateEncodeStreamPb {
  EncodedStreamShmInfoPb stream = 1;
}

message A2PReqDestroyEncodeStreamPb {
  uint32 stream_id = 1;
}

message P2ANtfEncodeStreamInvalidatedPb {
  uint32 stream_id = 1;
  EncodedStreamInvalidReasonPb reason = 2;
}

message P2ANtfEncodeFrameReadyPb {
  uint32 stream_id = 1;
  uint64 packet_seq = 2;
  uint64 pts_us = 3;
  bool key_frame = 4;
}


message P2ANtfUsbHostStatePb {
  bool online = 1;
  string reason = 2;
}

message P2ANtfCommPeerStatePb {
  uint32 channel_id = 1;
  bool online = 2;
  string reason = 3;
}

message A2PDataCommChannelPb {
  uint32 channel_id = 1;
  bytes payload = 2;
}

message P2ADataCommChannelPb {
  uint32 channel_id = 1;
  bytes payload = 2;
}


// Requests are correlated only by IPCHeaderPb.track_id (nonzero).
message P2AReqGetAppConfigPb {}
message A2PRspGetAppConfigPb {
  bytes schema_description_json = 1;
  bytes config_json = 2;
  int32 error_code = 3;
  string error_message = 4;
}
message P2AReqSetAppConfigPb {
  bytes config_json = 1;
}
message A2PRspSetAppConfigPb {
  int32 error_code = 1;
  string error_message = 2;
  bytes config_json = 3;
}

// Full-screen AppView surface is independent from TX overlay surfaces.
message AppViewSurfaceInfoPb {
  uint32 surface_id = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 stride = 5;
  uint64 size = 6;
  PixelFormatPb pixel_format = 7;
}
message A2PReqCreateAppViewSurfacePb {}
message P2ARspCreateAppViewSurfacePb {
  AppViewSurfaceInfoPb surface = 1;
}
message A2PReqDestroyAppViewSurfacePb {
  uint32 surface_id = 1;
}
message A2PNtfAppViewFrameReadyPb {
  uint32 surface_id = 1;
  uint64 frame_seq = 2;
}
message P2ANtfAppViewPointerPb {
  uint32 surface_id = 1;
  uint64 sequence = 2;
  int32 x = 3;
  int32 y = 4;
  bool pressed = 5;
  bool cancelled = 6;
}
message P2ANtfAppViewVisibilityPb {
  uint32 surface_id = 1;
  bool visible = 2;
}

message IPCPayloadPb {
  // Payload field number always equals MessageTypePb numeric value.
  oneof body {
    A2PReqCreateSessionPb a2p_req_create_session = 1;  // MSG_A2P_REQ_CREATE_SESSION
    P2ARspCreateSessionPb p2a_rsp_create_session = 2;  // MSG_P2A_RSP_CREATE_SESSION
    A2PReqCloseSessionPb a2p_req_close_session = 3;  // MSG_A2P_REQ_CLOSE_SESSION
    A2PReqSetRxParamsPb a2p_req_set_rx_params = 10;  // MSG_A2P_REQ_SET_RX_PARAMS
    P2ANtfRxShmReadyPb p2a_ntf_rx_shm_ready = 11;  // MSG_P2A_NTF_RX_SHM_READY
    P2ANtfRxShmInvalidatedPb p2a_ntf_rx_shm_invalidated = 12;  // MSG_P2A_NTF_RX_SHM_INVALIDATED
    A2PReqCreateTxShmPb a2p_req_create_tx_shm = 20;  // MSG_A2P_REQ_CREATE_TX_SHM
    P2ARspCreateTxShmPb p2a_rsp_create_tx_shm = 21;  // MSG_P2A_RSP_CREATE_TX_SHM
    A2PReqDestroyTxShmPb a2p_req_destroy_tx_shm = 22;  // MSG_A2P_REQ_DESTROY_TX_SHM
    P2ANtfTxShmDestroyedPb p2a_ntf_tx_shm_destroyed = 23;  // MSG_P2A_NTF_TX_SHM_DESTROYED
    A2PReqSetTxParamsPb a2p_req_set_tx_params = 30;  // MSG_A2P_REQ_SET_TX_PARAMS
    kavio.input.proto.InputEventPb a2p_ntf_input_event = 31;  // MSG_A2P_NTF_INPUT_EVENT
    A2PReqQueryRuntimeDataPb a2p_req_query_runtime_data = 40;  // MSG_A2P_REQ_QUERY_RUNTIME_DATA
    A2PReqQueryRuntimeRxInfoPb a2p_req_query_runtime_rx_info = 41;  // MSG_A2P_REQ_QUERY_RUNTIME_RX_INFO
    A2PReqQueryRuntimeTxInfoPb a2p_req_query_runtime_tx_info = 42;  // MSG_A2P_REQ_QUERY_RUNTIME_TX_INFO
    A2PReqQueryRuntimeInputPb a2p_req_query_runtime_input = 43;  // MSG_A2P_REQ_QUERY_RUNTIME_INPUT
    kavio.runtime.proto.RuntimeDataPb p2a_rsp_runtime_data = 44;  // MSG_P2A_RSP_RUNTIME_DATA
    kavio.runtime.proto.RuntimeDataPb p2a_ntf_runtime_data = 45;  // MSG_P2A_NTF_RUNTIME_DATA
    A2PReqQueryStatsPb a2p_req_query_stats = 50;  // MSG_A2P_REQ_QUERY_STATS
    P2ARspQueryStatsPb p2a_rsp_query_stats = 51;  // MSG_P2A_RSP_QUERY_STATS
    A2PReqCreateEncodeStreamPb a2p_req_create_encode_stream = 60;  // MSG_A2P_REQ_CREATE_ENCODE_STREAM
    P2ARspCreateEncodeStreamPb p2a_rsp_create_encode_stream = 61;  // MSG_P2A_RSP_CREATE_ENCODE_STREAM
    A2PReqDestroyEncodeStreamPb a2p_req_destroy_encode_stream = 62;  // MSG_A2P_REQ_DESTROY_ENCODE_STREAM
    P2ANtfEncodeStreamInvalidatedPb p2a_ntf_encode_stream_invalidated = 65;  // MSG_P2A_NTF_ENCODE_STREAM_INVALIDATED
    P2ANtfEncodeFrameReadyPb p2a_ntf_encode_frame_ready = 66;  // MSG_P2A_NTF_ENCODE_FRAME_READY
    P2ANtfUsbHostStatePb p2a_ntf_usb_host_state = 70;  // MSG_P2A_NTF_USB_HOST_STATE
    P2ANtfCommPeerStatePb p2a_ntf_comm_peer_state = 71;  // MSG_P2A_NTF_COMM_PEER_STATE
    P2ADataCommChannelPb p2a_data_comm_channel = 73;  // MSG_P2A_DATA_COMM_CHANNEL
    A2PDataCommChannelPb a2p_data_comm_channel = 74;  // MSG_A2P_DATA_COMM_CHANNEL
    P2AReqGetAppConfigPb p2a_req_get_app_config = 75;  // MSG_P2A_REQ_GET_APP_CONFIG
    A2PRspGetAppConfigPb a2p_rsp_get_app_config = 76;  // MSG_A2P_RSP_GET_APP_CONFIG
    P2AReqSetAppConfigPb p2a_req_set_app_config = 77;  // MSG_P2A_REQ_SET_APP_CONFIG
    A2PRspSetAppConfigPb a2p_rsp_set_app_config = 78;  // MSG_A2P_RSP_SET_APP_CONFIG
    A2PReqCreateAppViewSurfacePb a2p_req_create_app_view_surface = 80;  // MSG_A2P_REQ_CREATE_APP_VIEW_SURFACE
    P2ARspCreateAppViewSurfacePb p2a_rsp_create_app_view_surface = 81;  // MSG_P2A_RSP_CREATE_APP_VIEW_SURFACE
    A2PReqDestroyAppViewSurfacePb a2p_req_destroy_app_view_surface = 82;  // MSG_A2P_REQ_DESTROY_APP_VIEW_SURFACE
    A2PNtfAppViewFrameReadyPb a2p_ntf_app_view_frame_ready = 83;  // MSG_A2P_NTF_APP_VIEW_FRAME_READY
    P2ANtfAppViewPointerPb p2a_ntf_app_view_pointer = 84;  // MSG_P2A_NTF_APP_VIEW_POINTER
    P2ANtfAppViewVisibilityPb p2a_ntf_app_view_visibility = 85;  // MSG_P2A_NTF_APP_VIEW_VISIBILITY
    P2ARspStatusPb p2a_rsp_status = 90;  // MSG_P2A_RSP_STATUS
    P2ARspErrorPb p2a_rsp_error = 91;  // MSG_P2A_RSP_ERROR
  }
}

message IPCPackagePb {
  IPCHeaderPb header = 1;
  IPCPayloadPb payload = 2;
}
