syntax = "proto3";
package kavio.app.proto;

/*
 * Kavio App 安装包 manifest.json 的 Protobuf 定义。
 * files 记录包内文件大小和 SHA-256，用于完整性校验。
 *
 * 一个 Kavio App 由唯一 app_id 标识，可包含：
 * - Device Component：运行于 Kavio 设备；
 * - Host Component：可选，运行于 Windows，由 Kavio App Host 加载；
 * - App Configuration：通过包根目录固定的 schema_description.json 声明，{} 表示无配置。
 */
message AppManifestFilePb {
  string path = 1;
  uint64 size = 2;
  string sha256 = 3;
}

message DeviceComponentPythonPb {
  string python_version = 1;
  string install_mode = 2;
  string environment_archive = 3;
  string environment_definition = 4;
  string requirements = 5;
}

message DeviceComponentPb {
  string runtime = 1;
  string entry = 2;
  repeated string arguments = 3;
  DeviceComponentPythonPb python = 4;
}

message HostComponentPb {
  string binary = 1;
  bool panel = 2;
}

message AppManifestPb {
  uint32 manifest_version = 1;
  string app_id = 2;
  string version = 3;
  string name = 4;
  string description = 5;
  // Fixed package path generated by the packager: icon.png.
  string icon = 6;
  DeviceComponentPb device = 7;
  HostComponentPb host = 8;
  repeated AppManifestFilePb files = 9;
}

message AppSignaturePb {
  string algorithm = 1;
  string key_id = 2;
  string signature = 3;  // Ed25519 签名字节的 Base64 编码。
}

